spring.application.name=shiparrival

# Server Port
server.port=8080

# H2 File-based Persistence
spring.datasource.url=jdbc:h2:file:./data/shiparrival_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Telegram Notification Settings (Free Bot)
telegram.bot.token=
telegram.bot.chat-id=
telegram.bot.enabled=false

# Scheduled Tracking (Daily 08:00 AM)
tracking.schedule.cron=0 0 8 * * *
tracking.request.delay-ms=2000

# Multipart Upload Limits (Excel)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
