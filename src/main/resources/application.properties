spring.application.name=shiparrival

# Cargar variables de entorno desde el archivo .env (desarrollo local)
spring.config.import=optional:file:.env[.properties]

# Server Port
server.port=8080

# Mantener la sesión solo mediante cookie. Evita que Tomcat agregue
# ;jsessionid a los redirects, ruta que Spring MVC no resuelve y devuelve 404.
server.servlet.session.tracking-modes=cookie

# PostgreSQL / Supabase persistence. Credentials are loaded from .env and must
# never be committed. H2 remains available for tests and the local backup.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Pool de conexiones reducido a propósito.
# El pooler de Supabase en modo sesión (puerto 5432) acepta como máximo 15
# clientes concurrentes. El dashboard en Render y las ejecuciones desatendidas
# en GitHub Actions comparten ese presupuesto, así que se mantiene un pool
# pequeño; con el valor por defecto de Hikari (10) dos procesos lo agotan y el
# arranque falla con "EMAXCONNSESSION".
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# H2 Web Console disabled while PostgreSQL is the active datasource
spring.h2.console.enabled=false

# Telegram Notification Settings (Free Bot)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:}
telegram.bot.enabled=${TELEGRAM_ENABLED:false}

# Discord Notification Settings (Webhook)
discord.webhook.url=${DISCORD_WEBHOOK_URL:}
discord.bot.enabled=${DISCORD_ENABLED:false}

# Zona horaria de la aplicación.
# Las entidades usan LocalDateTime (sin zona), así que el valor depende del
# reloj del proceso. Se fija explícitamente para que el "último chequeo" sea
# idéntico en local, en GitHub Actions (UTC) y en Render.
app.timezone=${APP_TIMEZONE:America/Lima}

# Autenticación del dashboard. Se desactiva solo en pruebas.
app.auth.enabled=${APP_AUTH_ENABLED:true}

# Primera cuenta administradora. Solo se usa cuando no existe ninguna cuenta.
app.auth.admin.username=${ADMIN_USERNAME:}
app.auth.admin.password=${ADMIN_PASSWORD:}

# Sesión de 12 horas: es un panel de operaciones, no una red social.
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Scheduled Tracking (Daily 08:00 AM)
tracking.schedule.cron=0 0 8 * * *
tracking.request.delay-ms=2000

# Hapag-Lloyd Tracking
# Se usa un Chrome normal fuera de pantalla con un perfil persistente porque
# Cloudflare bloquea las peticiones HTTP directas y Chrome headless.
hapag-lloyd.chrome.path=${HAPAG_LLOYD_CHROME_PATH:}
hapag-lloyd.profile-dir=${HAPAG_LLOYD_PROFILE_DIR:./data/hapag-chrome-profile}
hapag-lloyd.remote-debug-port=${HAPAG_LLOYD_DEBUG_PORT:0}
hapag-lloyd.page-timeout-seconds=${HAPAG_LLOYD_PAGE_TIMEOUT_SECONDS:90}
hapag-lloyd.headless=${HAPAG_LLOYD_HEADLESS:false}

# Multipart Upload Limits (Excel)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
