<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - ShipArrival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-water me-1"></i>ShipArrival
        </a>
        <div class="d-flex align-items-center gap-3">
            <a class="btn btn-sm btn-outline-light" th:href="@{/}">
                <i class="bi bi-arrow-left me-1"></i>Dashboard
            </a>
            <span class="text-white-50 small" th:text="${currentUser != null ? currentUser.username : ''}"></span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="d-flex align-items-center mb-3">
        <h5 class="fw-bold mb-0"><i class="bi bi-people me-2"></i>Cuentas de acceso</h5>
    </div>

    <div th:if="${successMessage}" class="alert alert-success py-2 small" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i><span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMessage}"></span>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white fw-semibold small">
            <i class="bi bi-person-plus me-1"></i>Nueva cuenta
        </div>
        <div class="card-body">
            <form th:action="@{/users}" method="post" class="row g-2 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="new-username" class="form-label small mb-1">Usuario</label>
                    <input type="text" class="form-control form-control-sm" id="new-username"
                           name="username" required minlength="3" maxlength="32"
                           placeholder="ej. maria.lopez">
                </div>
                <div class="col-12 col-md-4">
                    <label for="new-password" class="form-label small mb-1">Contraseña inicial</label>
                    <input type="password" class="form-control form-control-sm" id="new-password"
                           name="password" required minlength="8" autocomplete="new-password">
                </div>
                <div class="col-8 col-md-2">
                    <label for="new-role" class="form-label small mb-1">Rol</label>
                    <select class="form-select form-select-sm" id="new-role" name="role">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">USER</option>
                    </select>
                </div>
                <div class="col-4 col-md-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">
                        <i class="bi bi-plus-lg me-1"></i>Crear
                    </button>
                </div>
            </form>
            <p class="text-muted small mb-0 mt-2">
                Mínimo 8 caracteres. El usuario admite minúsculas, números, punto, guion y guion bajo.
            </p>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead class="table-light">
                <tr class="small text-muted">
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Último acceso</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td class="fw-semibold" th:text="${u.username}">usuario</td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.role.name() == 'ADMIN'} ? 'text-bg-primary' : 'text-bg-secondary'"
                              th:text="${u.role}">USER</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.enabled} ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${u.enabled} ? 'Activa' : 'Desactivada'">Activa</span>
                    </td>
                    <td class="small text-muted"
                        th:text="${u.lastLoginAt != null ? #temporals.format(u.lastLoginAt, 'yyyy-MM-dd HH:mm') : 'Nunca'}">
                        Nunca
                    </td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-1 align-items-center">

                            <form th:action="@{/users/{id}/toggle(id=${u.id})}" method="post" class="mb-0">
                                <button type="submit" class="btn btn-sm btn-outline-secondary"
                                        th:title="${u.enabled} ? 'Desactivar' : 'Activar'">
                                    <i class="bi" th:classappend="${u.enabled} ? 'bi-pause-circle' : 'bi-play-circle'"></i>
                                </button>
                            </form>

                            <form th:action="@{/users/{id}/role(id=${u.id})}" method="post" class="mb-0 d-flex gap-1">
                                <select class="form-select form-select-sm" name="role" style="width: 100px;">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                            th:selected="${r == u.role}">USER</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-secondary" title="Cambiar rol">
                                    <i class="bi bi-arrow-repeat"></i>
                                </button>
                            </form>

                            <button type="button" class="btn btn-sm btn-outline-secondary" title="Restablecer contraseña"
                                    data-bs-toggle="modal" th:attr="data-bs-target='#pwd-' + ${u.id}">
                                <i class="bi bi-key"></i>
                            </button>

                            <form th:action="@{/users/{id}/delete(id=${u.id})}" method="post" class="mb-0"
                                  onsubmit="return confirm('¿Eliminar la cuenta definitivamente?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>

                        <div class="modal fade" th:id="'pwd-' + ${u.id}" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <form th:action="@{/users/{id}/password(id=${u.id})}" method="post">
                                        <div class="modal-header">
                                            <h6 class="modal-title">Restablecer contraseña de
                                                <span th:text="${u.username}"></span></h6>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body text-start">
                                            <label class="form-label small" th:for="'pwd-input-' + ${u.id}">
                                                Nueva contraseña
                                            </label>
                                            <input type="password" class="form-control form-control-sm"
                                                   th:id="'pwd-input-' + ${u.id}" name="password"
                                                   required minlength="8" autocomplete="new-password">
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-sm btn-secondary"
                                                    data-bs-dismiss="modal">Cancelar</button>
                                            <button type="submit" class="btn btn-sm btn-primary">Guardar</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5" class="text-center text-muted small py-4">No hay cuentas registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
