<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - ShipArrival</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark d-flex align-items-center" style="min-height: 100vh;">

<div class="container" style="max-width: 420px;">
    <div class="card shadow-lg border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-water text-info" style="font-size: 2.5rem;"></i>
                <h4 class="fw-bold mt-2 mb-0">ShipArrival</h4>
                <p class="text-muted small mb-0">Monitoreo de arribo de buques</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span th:text="${errorMessage}">Usuario o contraseña incorrectos.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" name="redirect" th:value="${redirect}">

                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username"
                           autocomplete="username" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-semibold">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                </button>
            </form>
        </div>
    </div>
    <p class="text-center text-secondary small mt-3 mb-0">
        Acceso restringido. Si no tienes cuenta, pídesela a un administrador.
    </p>
</div>

</body>
</html>
