name: Daily Ship Arrival Monitoring

# El egreso de las navieras sale por Cloudflare WARP en modo proxy (SOCKS5 en
# 127.0.0.1:40000). Se midió que la única variable que decide si Hapag-Lloyd
# responde es la IP de salida: WARP + Chrome headless devuelve el detalle del
# B/L igual que headful o stealth, y es la variante más rápida y con menos
# piezas (sin servidor de pantalla, sin perfil persistente). MSC y Maersk siguen saliendo
# directos: no necesitan proxy y su tráfico no pasa por WARP.

on:
  schedule:
    # GitHub Actions usa UTC. 13:00 UTC = 08:00 AM en Peru (UTC-5).
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite disparar el monitoreo manualmente en cualquier momento

# Evita que dos monitoreos se pisen sobre la misma base de datos.
concurrency:
  group: daily-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    # Fijado a 24.04: `ubuntu-latest` ya apunta a 26.04, que no provee
    # libtss2-tctildr0t64 y hace fallar la instalación de cloudflare-warp.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build application (before WARP)
        run: ./mvnw -B -Dmaven.test.skip=true package

      - name: Ensure Google Chrome is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Google Chrome no encontrado; instalando..."
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Cache Selenium Drivers
        uses: actions/cache@v4
        with:
          path: ~/.cache/selenium
          key: selenium-cache-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            selenium-cache-${{ runner.os }}-

      - name: Prefetch ChromeDriver and resolve driver before Tailscale
        run: |
          SM_JAR=$(find ~/.m2/repository -name "selenium-manager-*.jar" | head -n 1)
          if [ -n "$SM_JAR" ]; then
            echo "Extrayendo selenium-manager desde $SM_JAR..."
            unzip -p "$SM_JAR" org/openqa/selenium/manager/linux/selenium-manager > /tmp/selenium-manager
            chmod +x /tmp/selenium-manager
            echo "Descargando y verificando compatibilidad de ChromeDriver..."
            /tmp/selenium-manager --browser chrome --avoid-stats
            echo "ChromeDriver pre-descargado con éxito antes de conectar el proxy de egreso."
          else
            echo "Advertencia: No se encontró selenium-manager jar en ~/.m2"
          fi

      - name: Cache WARP packages
        uses: actions/cache@v4
        with:
          path: ~/.warp-debs
          key: warp-debs-${{ runner.os }}-v1

      - name: Install cloudflare-warp
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.warp-debs"

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          CODENAME=$(. /etc/os-release && echo "${VERSION_CODENAME}")
          echo "Repositorio WARP con codename real: ${CODENAME}"
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null

          if compgen -G "$HOME/.warp-debs/*.deb" >/dev/null; then
            echo "Instalando cloudflare-warp desde el caché local..."
            sudo dpkg -i "$HOME"/.warp-debs/*.deb \
              || echo "dpkg -i dejó dependencias pendientes; apt-get las resolverá a continuación"
          else
            echo "Sin .deb en caché; se instalará desde el repositorio."
          fi

          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq --no-install-recommends cloudflare-warp; then
            echo "::warning::cloudflare-warp no instaló a la primera; se inspecciona libtss2-tctildr0t64."
            apt-cache policy libtss2-tctildr0t64 || true
            sudo apt-get install -y -qq --no-install-recommends libtss2-tctildr0t64 \
              || sudo apt-get install -y -qq --no-install-recommends libtss2-tctildr0t \
              || true
            sudo apt-get install -y -qq --no-install-recommends -f cloudflare-warp
          fi
          warp-cli --version

          # Guardar los .deb para que la próxima ejecución no vuelva a descargarlos.
          if compgen -G "/var/cache/apt/archives/*.deb" >/dev/null; then
            cp -n /var/cache/apt/archives/*.deb "$HOME/.warp-debs/" 2>/dev/null || true
            echo ".deb en caché: $(ls -1 "$HOME/.warp-debs"/*.deb | wc -l)"
          fi

      - name: Connect WARP through SOCKS5 proxy
        run: |
          set -euo pipefail
          if ! sudo systemctl enable --now warp-svc 2>/dev/null; then
            echo "systemd no disponible; arrancando warp-svc con nohup"
            sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
          fi

          for i in $(seq 1 30); do
            if warp-cli --accept-tos status >/dev/null 2>&1; then
              echo "El demonio responde (intento ${i})."
              break
            fi
            sleep 1
          done

          if ! warp-cli --accept-tos registration show >/dev/null 2>&1; then
            warp-cli --accept-tos registration new
          fi
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect

          for i in $(seq 1 60); do
            status=$(warp-cli --accept-tos status 2>&1 || true)
            echo "[${i}] ${status}"
            if echo "$status" | grep -qiE '(^|[[:space:]])connected([[:space:]]|$)' \
              && ! echo "$status" | grep -qi 'disconnected'; then
              echo "WARP conectado en modo proxy (SOCKS5 127.0.0.1:40000)."
              exit 0
            fi
            sleep 2
          done

          # No se aborta: Hapag-Lloyd quedará en ERROR_CHECKING y se reintentará
          # mañana, pero MSC y Maersk salen directos y deben consultarse igual.
          echo "::warning::WARP no llegó a Connected en 120 s; Hapag-Lloyd fallará este ciclo y MSC/Maersk siguen por conexión directa."
          warp-cli --accept-tos status || true
          sudo journalctl -u warp-svc --no-pager -n 100 2>/dev/null || true
          sudo cat /tmp/warp-svc.log 2>/dev/null || true
          exit 0

      # Informativo: si el SOCKS5 no responde no se aborta el ciclo, porque MSC
      # y Maersk van por conexión directa y deben seguir consultándose.
      - name: Verify egress through WARP SOCKS5
        run: |
          set -euo pipefail
          direct=$(curl -fsS --max-time 20 https://api.ipify.org || true)

          socks=""
          for i in $(seq 1 10); do
            if socks=$(curl -fsS --max-time 20 --socks5 127.0.0.1:40000 https://api.ipify.org 2>/dev/null); then
              break
            fi
            socks=""
            echo "SOCKS5 aún sin respuesta (intento ${i}/10)"
            sleep 3
          done

          {
            echo "### Egreso observado"
            echo ""
            echo "| Ruta | IP pública |"
            echo "| --- | --- |"
            echo "| Directa del runner | \`${direct:-<vacío>}\` |"
            echo "| SOCKS5 127.0.0.1:40000 (WARP) | \`${socks:-<sin respuesta>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$socks" ]; then
            echo "::warning::El SOCKS5 de WARP (127.0.0.1:40000) no respondió; Hapag-Lloyd fallará pero MSC y Maersk siguen por conexión directa."
            warp-cli --accept-tos status || true
            exit 0
          fi
          if [ -n "$direct" ] && [ "$direct" = "$socks" ]; then
            echo "::warning::La IP directa y la de WARP son la misma (${direct}); el tráfico no está saliendo por WARP."
            exit 0
          fi
          echo "Egreso confirmado por WARP: ${direct:-<vacío>} -> ${socks}"

      - name: Run tracking cycle once
        env:
          SE_OFFLINE: "true"
          SE_AVOID_STATS: "true"
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_ENABLED }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          TRACKING_MANUAL_CHECK_CARRIERS: ${{ github.event_name == 'schedule' && 'HAPAG_LLOYD' || '' }}
          HAPAG_LLOYD_PROXY: "socks5://127.0.0.1:40000"
          HAPAG_LLOYD_HEADLESS: "true"
          APP_TIMEZONE: "America/Lima"
          TRACKING_RUN_ID: ${{ github.run_id }}
          TRACKING_ORIGIN: ci
          TRACKING_PARALLEL_ENABLED: "true"
          TRACKING_REQUEST_DELAY_MS: "1000"
        run: |
          JAR=$(ls target/*.jar | head -n 1)
          echo "Ejecutando ciclo de monitoreo con $JAR"

          # El pooler de Supabase en modo sesión admite 15 clientes en total y el
          # dashboard en Render ya reserva parte de ese presupuesto. Este proceso
          # es de un solo hilo, así que basta con 2 conexiones.
          for attempt in 1 2 3; do
            echo "--- Intento $attempt de 3 ---"
            if java -jar "$JAR" \
                --tracking.run-once=true \
                --spring.datasource.hikari.maximum-pool-size=2 \
                --spring.datasource.hikari.minimum-idle=1; then
              echo "Monitoreo completado correctamente."
              exit 0
            fi
            echo "El intento $attempt falló."
            if [ "$attempt" -lt 3 ]; then
              echo "Esperando 60 s antes de reintentar (el pooler puede tardar en liberar sesiones)..."
              sleep 60
            fi
          done

          echo "::error::El monitoreo falló tras 3 intentos."
          exit 1
