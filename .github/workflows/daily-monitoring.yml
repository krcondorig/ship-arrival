name: Daily Ship Arrival Monitoring

on:
  schedule:
    # GitHub Actions usa UTC. 13:00 UTC = 08:00 AM en Peru (UTC-5).
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite disparar el monitoreo manualmente en cualquier momento

# Evita que dos monitoreos se pisen sobre la misma base de datos.
concurrency:
  group: daily-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw -B -DskipTests package

      - name: Ensure Google Chrome is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Google Chrome no encontrado; instalando..."
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Prepare Hapag-Lloyd Chrome profile directory
        run: mkdir -p data/hapag-chrome-profile

      - name: Restore Hapag-Lloyd Chrome profile
        uses: actions/cache@v4
        with:
          path: data/hapag-chrome-profile
          key: hapag-chrome-profile-${{ github.run_id }}
          restore-keys: |
            hapag-chrome-profile-

      - name: Connect to Tailscale (Phone Exit Node)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Activate Phone Exit Node
        run: |
          sudo tailscale set --exit-node=100.77.93.94
          echo "IP publica visible para las navieras:"
          curl -s --max-time 20 https://ifconfig.me/ip
          echo ""

      - name: Run tracking cycle once
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_ENABLED }}
          HAPAG_LLOYD_HEADLESS: "false"
        run: |
          JAR=$(ls target/*.jar | head -n 1)
          echo "Ejecutando ciclo de monitoreo con $JAR"

          # El pooler de Supabase en modo sesión admite 15 clientes en total y el
          # dashboard en Render ya reserva parte de ese presupuesto. Este proceso
          # es de un solo hilo, así que basta con 2 conexiones.
          for attempt in 1 2 3; do
            echo "--- Intento $attempt de 3 ---"
            if xvfb-run -a java -jar "$JAR" \
                --tracking.run-once=true \
                --spring.datasource.hikari.maximum-pool-size=2 \
                --spring.datasource.hikari.minimum-idle=1; then
              echo "Monitoreo completado correctamente."
              exit 0
            fi
            echo "El intento $attempt falló."
            if [ "$attempt" -lt 3 ]; then
              echo "Esperando 60 s antes de reintentar (el pooler puede tardar en liberar sesiones)..."
              sleep 60
            fi
          done

          echo "::error::El monitoreo falló tras 3 intentos."
          exit 1
