name: Test Mobile Proxy via Tailscale

on:
  workflow_dispatch:

jobs:
  test-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chrome --with-deps

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Activate Phone Exit Node & Test Navieras
        run: |
          echo "=== 1. Enrutando todo el trafico a traves del celular ==="
          sudo tailscale set --exit-node=100.77.93.94

          echo "=== 2. IP publica del celular ==="
          curl -s --max-time 15 https://ifconfig.me/ip
          echo ""

          echo "=== 3. Probando ONE (Ocean Network Express) por el celular ==="
          python3 - << 'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          async def run():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      channel="chrome",
                      headless=True,
                      args=["--no-sandbox", "--disable-dev-shm-usage"]
                  )
                  page = await browser.new_page()
                  print("Consultando ONE...")
                  await page.goto("https://ecomm.one-line.com/one-ecom/manage-shipment/cargo-tracking", timeout=30000)
                  print("ONE cargado exitosamente. Titulo:", await page.title())
                  await browser.close()

          asyncio.run(run())
          EOF
