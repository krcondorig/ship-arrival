name: ShipArrival - Daily Tracking Worker & CI

on:
  schedule:
    - cron: '0 8 * * *' # Todos los días a las 08:00 UTC (03:00 AM Perú)
  workflow_dispatch: # Permite disparar el monitoreo manualmente desde la pestaña Actions en GitHub

jobs:
  run-tracking:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Grant execution permission to Maven wrapper
        run: chmod +x mvnw

      - name: Validate Supabase connection
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
        run: |
          echo "URL set? ${SPRING_DATASOURCE_URL:+yes}"
          python3 - <<'PY'
          import os, re, socket
          url = os.environ.get("SPRING_DATASOURCE_URL", "")
          print("starts_with_jdbc_postgresql =", url.startswith("jdbc:postgresql://"))
          print("starts_with_postgresql =", url.startswith("postgresql://"))
          print("starts_with_postgres =", url.startswith("postgres://"))
          print("contains_sslmode =", "sslmode" in url.lower())
          m = re.search(r'://([^:/]+):(\d+)', url)
          if m:
              host, port = m.group(1), int(m.group(2))
              print(f"host = {host}")
              print(f"port = {port}")
              try:
                  s = socket.create_connection((host, port), timeout=10)
                  s.close()
                  print(f"TCP connection to {host}:{port} = OK")
              except Exception as e:
                  print(f"TCP connection to {host}:{port} = FAILED: {e}")
          else:
              print("host_port_parse = FAILED - URL format may be wrong")
          PY

      - name: Run Spring Boot Tracking Worker (Supabase + Chrome)
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_ENABLED }}
        run: |
          bash ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod -Dspring-boot.run.args="--run-tracking"
