# ============================================================================
# SONDA TEMPORAL Y DESECHABLE — no forma parte del monitoreo diario.
#
# Por qué existe: mide una única pregunta. ¿`ChromeHapagLloydTrackingClient`
# (CDP puro, Chrome con `headless=false` bajo xvfb) pasa el desafío de
# Cloudflare cuando el egreso es Cloudflare WARP en lugar de la IP del
# datacenter de GitHub? No mide la lógica de negocio, no toca la base de datos
# y no gasta créditos de ZenRows.
#
# Se borrará cuando el resultado se traslade a `daily-monitoring.yml`.
# Deliberadamente NO reutiliza `carrier-network-diagnostic.yml`: ese archivo
# está declarado como aislado y sin Hapag-Lloyd por
# `DeploymentConfigurationTest.carrierNetworkDiagnosticIsIsolatedAndManualOnly`.
#
# Nota: `ChromeHapagLloydTrackingClient` ya acepta `--proxy-server` y resuelve
# el proxy desde `HAPAG_LLOYD_PROXY` cuando se instancia sin Spring (`new`),
# que es justo lo que hace esta sonda. Por eso la medición prueba el cliente
# real saliendo por WARP, no solo el egreso del runner verificado por curl.
# ============================================================================
# Run 5: el cliente usa ya el listado legacy (`track-by-booking-solution-legacy.html`).
# El run 4 mostro title='Tracking | Hapag-Lloyd' y url='/solutions/tracking/',
# que es la SPA nueva: faltaba el sufijo -legacy en TRACKING_URL.
name: Hapag WARP Probe

on:
  workflow_dispatch:
  # Disparo por push: el botón "Run workflow" de workflow_dispatch solo aparece
  # cuando el archivo existe en la rama por defecto (master), y esta sonda vive
  # en una rama de feature. Un push que toque este archivo lo ejecuta desde la
  # rama que lo recibió, que es lo que necesitamos para medir. Sonda desechable:
  # se borra cuando termine la comparación WARP vs Tailscale.
  push:
    paths:
      - '.github/workflows/hapag-warp-probe.yml'

permissions:
  contents: read

jobs:
  warp-probe:
    name: Hapag-Lloyd CDP through Cloudflare WARP
    # Fijado a 24.04: `ubuntu-latest` ya apunta a 26.04, que no provee
    # libtss2-tctildr0t64 y hace fallar la instalación de cloudflare-warp.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Ensure Google Chrome and xvfb are available
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Google Chrome no encontrado; instalando..."
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb no encontrado; instalando..."
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          google-chrome --version
          xvfb-run --help >/dev/null

      - name: Cache WARP packages
        uses: actions/cache@v4
        with:
          path: ~/.warp-debs
          key: warp-debs-${{ runner.os }}-v1

      - name: Install cloudflare-warp
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.warp-debs"

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          CODENAME=$(. /etc/os-release && echo "${VERSION_CODENAME}")
          echo "Repositorio WARP con codename real: ${CODENAME}"
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null

          if compgen -G "$HOME/.warp-debs/*.deb" >/dev/null; then
            echo "Instalando cloudflare-warp desde el caché local..."
            sudo dpkg -i "$HOME"/.warp-debs/*.deb \
              || echo "dpkg -i dejó dependencias pendientes; apt-get las resolverá a continuación"
          else
            echo "Sin .deb en caché; se instalará desde el repositorio."
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cloudflare-warp
          warp-cli --version

      - name: Refresh WARP package cache
        run: |
          set -euo pipefail
          cd "$HOME/.warp-debs"
          if apt-get download cloudflare-warp; then
            ls -la
          else
            echo "No se pudo refrescar el caché de .deb; se continúa (no afecta la medición)."
          fi

      - name: Start warp-svc
        run: |
          set -euo pipefail
          if command -v systemctl >/dev/null 2>&1 && sudo systemctl enable --now warp-svc 2>/dev/null; then
            echo "warp-svc iniciado con systemd"
          else
            echo "systemd no disponible; arrancando warp-svc con nohup"
            sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
          fi

          for i in $(seq 1 30); do
            out=$(sudo warp-cli --accept-tos status 2>&1 || true)
            if [ -n "$out" ] && ! echo "$out" | grep -qi "unable to connect"; then
              echo "El demonio responde (intento ${i}): ${out}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::warp-svc no respondió en 30 s; sin demonio no hay medición posible"
          sudo cat /tmp/warp-svc.log 2>/dev/null || true
          sudo journalctl -u warp-svc --no-pager -n 100 2>/dev/null || true
          exit 1

      - name: Register and switch WARP to proxy mode
        run: |
          set -euo pipefail
          if sudo warp-cli --accept-tos registration show >/dev/null 2>&1; then
            echo "Registro existente reutilizado"
          else
            sudo warp-cli --accept-tos registration new
          fi
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sudo warp-cli --accept-tos settings

      - name: Wait for WARP to reach Connected
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(sudo warp-cli --accept-tos status 2>&1 || true)
            echo "[${i}] ${status}"
            if echo "$status" | grep -qiE '(^|[[:space:]])connected([[:space:]]|$)' \
              && ! echo "$status" | grep -qi 'disconnected'; then
              echo "WARP conectado."
              exit 0
            fi
            sleep 2
          done

          echo "::error::WARP no llegó a Connected en 120 s; se aborta en lugar de salir por conexión directa"
          sudo warp-cli --accept-tos status || true
          sudo journalctl -u warp-svc --no-pager -n 100 2>/dev/null || true
          sudo cat /tmp/warp-svc.log 2>/dev/null || true
          exit 1

      - name: Verify egress through WARP SOCKS5
        run: |
          set -euo pipefail
          direct=$(curl -fsS --max-time 20 https://api.ipify.org || true)

          socks=""
          for i in $(seq 1 10); do
            if socks=$(curl -fsS --max-time 20 --socks5 127.0.0.1:40000 https://api.ipify.org 2>/dev/null); then
              break
            fi
            socks=""
            echo "SOCKS5 aún sin respuesta (intento ${i}/10)"
            sleep 3
          done

          {
            echo "### Egreso observado"
            echo ""
            echo "| Ruta | IP pública |"
            echo "| --- | --- |"
            echo "| Directa del runner | \`${direct:-<vacío>}\` |"
            echo "| SOCKS5 127.0.0.1:40000 (WARP) | \`${socks:-<sin respuesta>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$direct" ]; then
            echo "::error::No se pudo obtener la IP directa del runner"
            exit 1
          fi
          if [ -z "$socks" ]; then
            echo "::error::El SOCKS5 de WARP (127.0.0.1:40000) no respondió; se aborta en lugar de medir por conexión directa"
            sudo warp-cli --accept-tos status || true
            exit 1
          fi
          if [ "$direct" = "$socks" ]; then
            echo "::error::La IP directa y la de WARP son la misma (${direct}); el tráfico no está saliendo por WARP y la medición no tendría sentido"
            exit 1
          fi
          echo "Egreso confirmado por WARP: ${direct} -> ${socks}"

      - name: Measure Hapag-Lloyd tracking through WARP
        env:
          HAPAG_LLOYD_BROWSER_TEST: "true"
          HAPAG_LLOYD_ARRIVED_GUIDE: "HLCUNG12607EKZE0"
          HAPAG_LLOYD_PROXY: "socks5://127.0.0.1:40000"
          # Se mide la MISMA configuración que usa el cron: headless, sin xvfb.
          # La sonda del repo de referencia midió que headless, headful y stealth
          # son indistinguibles con WARP (8 estados, 14 filas, ~1,9-2,0 s), así
          # que se elige la variante con menos piezas. Medir aquí lo que se
          # despliega evita validar una configuración que nunca va a correr.
          HAPAG_LLOYD_HEADLESS: "true"
        run: |
          set -uo pipefail
          ./mvnw -B -Dtest=HapagLloydTrackingBrowserIntegrationTest test
          status=$?
          echo "=== mvn exit status: ${status} ==="

          # Los logs de Actions no son legibles sin token (403), pero las
          # anotaciones del check-run si lo son. Todo diagnostico que importe
          # tiene que salir por ::error:: para poder leerse desde la API.
          if [ "${status}" -ne 0 ]; then
            report=$(ls target/surefire-reports/*HapagLloydTrackingBrowserIntegrationTest.txt 2>/dev/null | head -n 1)
            if [ -n "${report}" ] && [ -f "${report}" ]; then
              echo "=== ${report} ==="
              cat "${report}"
              # Primera linea con pinta de fallo: "testX(Clase)  Time elapsed ... <<< FAILURE!"
              detail=$(grep -m 1 -E '<<< (FAILURE|ERROR)|AssertionFailedError|HapagLloydTrackingException' "${report}" || true)
              if [ -z "${detail}" ]; then
                detail=$(grep -m 1 -v '^\s*$' "${report}" || true)
              fi
              echo "::error::surefire: ${detail}"
            else
              echo "::error::No hay reporte de surefire: el fallo ocurrio antes de ejecutar el test (compilacion o arranque de Maven)."
            fi

            if [ -f data/hapag-chrome.log ]; then
              echo "=== data/hapag-chrome.log (ultimas 200 lineas) ==="
              tail -n 200 data/hapag-chrome.log
              # La ultima linea del log de Chrome suele decir donde se quedo.
              chrome_tail=$(tail -n 1 data/hapag-chrome.log || true)
              echo "::error::chrome-log-ultima-linea: ${chrome_tail}"
            else
              echo "::error::data/hapag-chrome.log no existe: Chrome nunca llego a arrancar."
            fi
          fi

          exit ${status}

      - name: Upload Chrome logs and profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hapag-warp-probe-chrome
          path: |
            data/hapag-chrome.log
            data/hapag-chrome-profile/**
            target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 3
