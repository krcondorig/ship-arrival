name: Carrier Network Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  without-tailscale:
    name: Without Tailscale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Ensure Google Chrome is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
      - name: Build and prefetch Maven dependencies
        run: ./mvnw -B -DskipTests test
      - name: Run isolated real-adapter diagnostics
        env:
          CARRIER_NETWORK_DIAGNOSTIC: "true"
        run: xvfb-run -a ./mvnw -B -o -Dtest=CarrierNetworkDiagnosticTest test

  with-phone-exit-node:
    name: With phone exit node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Ensure Google Chrome is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
      - name: Build and prefetch Maven dependencies
        run: ./mvnw -B -DskipTests test
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Activate phone exit node
        run: |
          sudo tailscale set --exit-node=100.77.93.94
          echo "Phone exit node selected; public egress IP:"
          curl -fsS --max-time 20 https://ifconfig.me/ip
      - name: Run isolated real-adapter diagnostics
        env:
          CARRIER_NETWORK_DIAGNOSTIC: "true"
        run: xvfb-run -a ./mvnw -B -o -Dtest=CarrierNetworkDiagnosticTest test
      - name: Disconnect from Tailscale
        if: always()
        run: |
          sudo tailscale set --exit-node= || true
          sudo tailscale down || true
